# Server
server.port=${PORT:8080}

# MongoDB — no fallback, MONGODB_URI must be set as an environment variable
spring.data.mongodb.uri=${MONGODB_URI}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:rkrbookingenquiry@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# App Config
app.company.name=${APP_COMPANY_NAME:RK & R Transports and Logistics}

# Booking recipient — override with BOOKING_RECIPIENT_EMAIL env var on Render
booking.recipient.email=${BOOKING_RECIPIENT_EMAIL:mounisha.chebrolu@gmail.com}



# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# Logging
logging.level.com.rkrtransports=INFO
logging.level.org.springframework.mail=WARN
logging.level.com.sun.mail=WARN
