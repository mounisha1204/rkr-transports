<section id="services" class="services" aria-labelledby="services-heading">
  <div class="container">
    <div class="services__header">
      <h2 class="section-title" id="services-heading">Our Services</h2>
      <p class="section-subtitle">Professional transport and logistics solutions tailored to meet your needs across Tasmania.</p>
    </div>

    <div class="services__grid" role="list" aria-label="Services offered">
      @for (service of services; track service.title; let i = $index) {
        <article class="service-card" role="listitem" [style.--card-color]="service.color">

          <div class="service-card__icon-wrap" aria-hidden="true">
            <div class="service-card__icon" [style.color]="service.color" [style.background]="service.bg">

              @if (i === 0) {
                <!-- Home Relocation -->
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="8" y="30" width="48" height="28" rx="3" fill="currentColor" opacity="0.12"/>
                  <path d="M4 32L32 8l28 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                  <rect x="22" y="40" width="20" height="18" rx="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2.5"/>
                  <rect x="12" y="36" width="10" height="10" rx="2" fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="2"/>
                  <rect x="42" y="36" width="10" height="10" rx="2" fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="2"/>
                  <path d="M32 40v18" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                  <path d="M22 58h20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <circle cx="32" cy="20" r="3" fill="currentColor" opacity="0.5"/>
                </svg>
              }

              @if (i === 1) {
                <!-- Furniture Transport -->
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="4" y="28" width="44" height="18" rx="4" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
                  <rect x="8" y="20" width="36" height="8" rx="3" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
                  <path d="M4 34H2a2 2 0 00-2 2v6h8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M48 34h2a2 2 0 012 2v6h-8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M10 46v6M42 46v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <rect x="44" y="20" width="18" height="30" rx="3" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2"/>
                  <path d="M48 30h10M48 36h10M48 42h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                  <circle cx="54" cy="50" r="4" fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="2"/>
                </svg>
              }

              @if (i === 2) {
                <!-- Furniture Assembly -->
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="8" y="36" width="28" height="20" rx="3" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
                  <path d="M8 46h28" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                  <path d="M16 56v4M28 56v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <path d="M36 8l6 6-18 18-6-6L36 8z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
                  <path d="M42 8a4 4 0 015 5l-5-5z" fill="currentColor" opacity="0.3"/>
                  <path d="M40 6l4 4a3 3 0 010 4l-4-4a3 3 0 010-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M18 32l-4 4v5h5l4-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="50" cy="46" r="10" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
                  <path d="M50 40v6l4 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              }

            </div>
          </div>

          <h3 class="service-card__title">{{ service.title }}</h3>
          <p class="service-card__desc">{{ service.desc }}</p>
        </article>
      }
    </div>
  </div>
</section>
