<section id="contact" class="contact" aria-labelledby="contact-heading">
  <div class="container">
    <div class="contact__header">
      <h2 class="section-title" id="contact-heading">Contact Us</h2>
      <p class="section-subtitle">Get in touch with our friendly team. We're here to help with all your transport needs.</p>
    </div>

    <div class="contact__grid" role="list" aria-label="Contact information">

      <!-- Email -->
      <div class="contact-card contact-card--email" role="listitem">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="14" width="52" height="36" rx="6" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
            <path d="M6 20l26 18L58 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 44l16-14M58 44L42 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
          </svg>
        </div>
        <div class="contact-card__body">
          <span class="contact-card__label">Email Us</span>
          <a href="mailto:rkrtransportslogistics@gmail.com" class="contact-card__value contact-card__value--link">rkrtransportslogistics&#64;gmail.com</a>
        </div>
      </div>

      <!-- Phone -->
      <div class="contact-card contact-card--phone" role="listitem">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="16" y="4" width="32" height="56" rx="6" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="32" cy="52" r="3" fill="currentColor" opacity="0.5"/>
            <path d="M24 12h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
            <path d="M22 28c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
            <path d="M26 34c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="32" cy="38" r="3" fill="currentColor"/>
          </svg>
        </div>
        <div class="contact-card__body">
          <span class="contact-card__label">Call Us</span>
          <a href="tel:+61451655415" class="contact-card__value contact-card__value--link">+61 451 655 415</a>
        </div>
      </div>

      <!-- Location -->
      <div class="contact-card contact-card--location" role="listitem">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="26" r="18" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="32" cy="26" r="7" fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="2.5"/>
            <path d="M32 8v4M32 40v4M14 26h4M46 26h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
            <path d="M32 44C32 44 18 56 18 58h28c0-2-14-14-14-14z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="contact-card__body">
          <span class="contact-card__label">Our Location</span>
          <span class="contact-card__value">Unit 3/110 Lennox Avenue<br>Lutana TAS 7009<br>Tasmania, Australia</span>
        </div>
      </div>

      <!-- Business Hours -->
      <div class="contact-card contact-card--hours" role="listitem">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="26" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="32" cy="32" r="3" fill="currentColor"/>
            <path d="M32 16v16l10 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 32h4M44 32h4M32 12v4M32 48v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
            <path d="M20 20l2.5 2.5M41.5 41.5L44 44M20 44l2.5-2.5M41.5 22.5L44 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
          </svg>
        </div>
        <div class="contact-card__body">
          <span class="contact-card__label">Business Hours</span>
          <span class="contact-card__value">Mon – Fri: 9:00 AM – 5:00 PM</span>
          <span class="contact-card__sub">AEST · Tasmania</span>
        </div>
      </div>

    </div>
  </div>
</section>
