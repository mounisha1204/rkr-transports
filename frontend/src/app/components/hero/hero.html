<section class="hero" aria-label="Hero Section">
  <div class="hero__overlay" aria-hidden="true"></div>

  <div class="hero__content">
    <h1 class="hero__company">RK &amp; R Transports and Logistics</h1>
    <p class="hero__subtitle">Reliable Transport &amp; Logistics Across Tasmania</p>
    <a routerLink="/booking-enquiry" class="btn-primary" aria-label="Book Transport">
      Book Transport
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <div class="hero__scroll" aria-label="Scroll down" role="button" tabindex="0" (click)="scrollDown()" (keydown.enter)="scrollDown()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</section>
